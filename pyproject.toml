[project]
name = "ai-investment-assistant"
version = "0.1.0"
description = "Local event driven investment monitoring and research assistant."
readme = "README.md"
authors = [
    { name = "Carlo Velarde", email = "cav2003@live.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
ai-investment-assistant = "investment_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investment_assistant"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
